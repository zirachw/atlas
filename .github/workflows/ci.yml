name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Each check reports on its own, so one failure does not cancel the others.
      fail-fast: false
      matrix:
        target: [lint, test, build, security]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          # Every module has its own go.sum, and none sits at the repo root.
          cache-dependency-path: '**/go.sum'
      - run: make ${{ matrix.target }}
